[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openshell-keyper-approval-lab"
version = "0.1.0"
description = "Mock human approval for exact, single-use sandbox network changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
openshell = ["grpcio>=1.78,<2", "protobuf>=6.33,<8"]
portable-vm = ["paramiko>=3.5,<6", "pycdlib>=1.14,<2", "olefile>=0.47,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
approval-lab = "approval_lab.cli:main"
approval-lab-mcp = "approval_lab.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
